<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}｜AirPangaea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16283D;
  --ink-soft:#4A5C6E;
  --ink-faint:#7C8B99;
  --paper:#FFFFFF;
  --jp:#1C4A6E;
  --rule:#D3DBE1;
  --serif:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",YuMincho,serif;
  --sans:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,Meiryo,sans-serif;
  --wide:66rem;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.9;font-feature-settings:"palt" 1;}
img{max-width:100%;height:auto;display:block}
a{color:var(--jp)}
a:focus-visible{outline:2px solid var(--jp);outline-offset:3px}
.wrap-wide{max-width:var(--wide);margin-inline:auto;padding-inline:24px}

/* ── ヘッダー：ja.airpangaea.com の白帯（事例ページと同じ） ── */
.site-head{background:#fff}
.site-head .bar{display:flex;align-items:center;gap:28px;padding-block:16px}
.site-head .logo img{width:200px;height:auto}
.site-nav{display:flex;gap:26px;margin-left:auto;font-size:.875rem}
.site-nav a{color:#2b2b2b;text-decoration:none}
.site-nav a:hover{color:var(--jp)}
.site-nav a[aria-current]{font-weight:700}
.util{display:flex;gap:18px;font-size:.8125rem;color:#2b2b2b}
.util a{color:#2b2b2b;text-decoration:none}

/* ── 見出し ── */
.page-head{padding-block:36px 0}
.page-head h1{font-family:var(--serif);font-weight:600;font-size:1.625rem;line-height:1.6;margin:0}

/* ── プログラムごとの事例カード ── */
.program{margin-block:36px 64px}
.program h2{font-family:var(--serif);font-weight:600;font-size:1.3125rem;line-height:1.6;
  margin:0 0 20px;padding-bottom:10px;border-bottom:1px solid var(--rule);}
.cards{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.card a{display:flex;flex-direction:column;height:100%;padding:22px 24px 20px;
  border:1px solid var(--rule);border-top:2px solid var(--ink);color:inherit;text-decoration:none}
.card a:hover{border-color:var(--jp)}
.card-schools{font-family:var(--serif);font-size:1rem;font-weight:600;line-height:1.6;margin:0 0 10px}
.card-schools span{display:block}
.card-role{font-size:.8125rem;color:var(--ink-faint);margin:0 0 6px}
.card-desc{font-size:.9375rem;color:var(--ink-soft);line-height:1.8;margin:0 0 16px}
.card-more{font-size:.875rem;color:var(--jp);margin:auto 0 0}

/* ── フッター（事例ページと同じ） ── */
.site-foot{border-top:1px solid var(--rule);padding-block:30px 48px;
  font-size:.8125rem;color:var(--ink-faint)}
.site-foot p{margin:0 0 10px}
.foot-links{display:flex;flex-wrap:wrap;gap:18px}
.foot-links a{color:var(--ink-faint);text-decoration:none}
.foot-links a:hover{text-decoration:underline}

@media (max-width:760px){
  .site-head .bar{flex-wrap:wrap;gap:12px}
  .site-nav{width:100%;margin-left:0;flex-wrap:wrap;gap:16px;order:3}
  .util{margin-left:auto}
  .cards{grid-template-columns:1fr}
}
/* ── 印刷・PDF ── */
/* @page はメディアクエリの外に置く（中に入れると効かない） */
@page{margin:16mm}
@media print{
  html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{font-size:10.5pt;line-height:1.75}
  /* 用紙幅に収まる実寸で指定する（remのままだとA4の版面をはみ出す） */
  .wrap-wide{max-width:170mm;padding-inline:0}
  .site-nav,.util{display:none}
  .site-head{border-bottom:1px solid var(--rule);margin-bottom:16px}
  .site-head .bar{padding-block:5mm 10px}
  a{color:var(--ink);text-decoration:none}
  .page-head{padding-block:0}
  .page-head h1{font-size:15pt}
  .program{margin-block:18px 24px}
  .program h2{font-size:12pt;break-after:avoid}
  .cards{gap:10px}
  .card a{padding:12px 14px}
  .card-more{display:none}
  /* 改ページ禁止はカード単位に限定する（大きい塊に付けると空白が出る） */
  .card{break-inside:avoid}
  .site-foot{break-inside:avoid;padding-block:16px 0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="site-head">
  <div class="wrap-wide bar">
    <a class="logo" href="https://ja.airpangaea.com"><img src="{{ images }}/logo.png" alt="AirPangaea" width="225" height="50"></a>
    <nav class="site-nav">
      <a href="https://ja.airpangaea.com">ホーム</a>
      <a href="https://ja.airpangaea.com/program">プログラム</a>
      <a href="/" aria-current="page">導入事例</a>
      <a href="https://ja.airpangaea.com/corporate">会社概要</a>
      <a href="https://ja.airpangaea.com/blog">Blog</a>
    </nav>
    <div class="util"><a href="https://ja.airpangaea.com">ログイン</a><span>日本語</span></div>
  </div>
</header>

<main>
<div class="wrap-wide">

{{ content }}

</div>
</main>

<footer class="site-foot">
  <div class="wrap-wide">
    <p>©2021-2026 AirPangaea, Inc.</p>
    <div class="foot-links">
      <a href="https://ja.airpangaea.com/privacy-policy">プライバシーポリシー</a>
      <a href="https://ja.airpangaea.com/terms-and-conditions">利用規約</a>
      <a href="https://ja.airpangaea.com/tokushoho">特定商取引法に基づく表記</a>
    </div>
  </div>
</footer>

</body>
</html>
